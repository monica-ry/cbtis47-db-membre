<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lu Loo Land</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/logo.jpeg">
</head>

<body>

    <div id="navbar"></div>

    <!-- HERO NUEVO -->
    <section class="hero-home">

        <div class="hero-overlay"></div>

        <div class="hero-content">
            <h1>LU LOO LAND</h1>
            <p>Where fantasy becomes reality</p>

            <div class="hero-buttons">
                <button onclick="location.href='games'">Explore Attractions</button>
                <button onclick="checkAccess('memberships')">Get Membership</button>
            </div>
        </div>

    </section>

    <!-- NOTIFICACIONES-->
    <div class="notification-box" id="notificationBox"></div>

    <!-- EVENTS -->
    <div class="section-container">
        <div class="sub"><a href="events">Recent events</a></div>

        <div class="carousel">
            <div class="slides" id="eventsSlides"></div>
            <div class="dots"></div>
        </div>
    </div>

    <!-- GAMES -->
    <div class="section-container">
        <p class="sub"><a href="games">Park attractions</a></p>

        <div class="carousel">
            <div class="slides" id="gamesSlides"></div>
            <div class="dots"></div>
        </div>
    </div>

    <!-- RESTAURANTS -->
    <div class="section-container">
        <p class="sub"><a href="restaurants">Restaurants</a></p>

        <div class="carousel">
            <div class="slides" id="restaurantsSlides"></div>
            <div class="dots"></div>
        </div>
    </div>

    <!-- LOCATION -->
    <div class="section-container">
        <p class="sub">Location</p>
        <p class="location-address" id="parkLocation"></p>
    </div>

    <!-- TEMPLATE -->
    <template id="slide-template">
        <div class="slide">
            <img class="slide-img">
            <div class="slide-text">
                <h3 class="slide-title"></h3>
                <p class="slide-desc"></p>
            </div>
        </div>
    </template>

    <!-- ACCOUNT MODAL -->
    <div class="modal-overlay" id="accountModal">

        <div class="account-modal">

        <div class="account-header">

            <div class="account-avatar">
                
            </div>

            <div class="account-info">
                <h2>My Account</h2>
                <span>Lu Loo Land Member</span>
            </div>

        </div>

        <div class="account-body">

            <div class="account-item">
                <label>Username</label>
                <p id="modalUsername"></p>
            </div>

            <div class="account-item">
                <label>Email</label>
                <p id="modalEmail"></p>
            </div>

            <button id="logoutBtn">
                Log out
            </button>

        </div>

    </div>

    <script src="js/navbar.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js?v=3"></script>
    <script src="js/carousel.js?v=3"></script>
    <script src="js/parkInfo.js"></script>

</body>

</html>
