<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memberships</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- TOP MENU -->
    <div class="top-menu">

        <div class="menu-logo">
            <img src="images/logo.jpeg" alt="logo">
        </div>

        <div class="menu-links">

            <div class="menu-item" onclick="checkAccess('memberships.html')">
                Membership
            </div>

            <div class="menu-item" onclick="location.href='games.html'">
                Games
            </div>

            <div class="menu-item" onclick="location.href='restaurants.html'">
                Restaurant
            </div>

            <div class="menu-item" onclick="location.href='parkInfo.html'">
                Park information
            </div>

        </div>

        <div class="menu-msg" onclick="checkAccess('messages.html')">
            <img src="images/msspark.png" alt="messages">
        </div>

        <div class="menu-profile" id="accountButton">
            <span id="userName">Log in</span>
        </div>

    </div>

    <!-- TITLE -->
    <div class="header">Memberships</div>

    <!-- CONTAINER -->
    <div class="membership-container" id="membershipContainer"></div>

    <!-- TEMPLATE -->
    <template id="membershipTemplate">

        <div class="membership-card">

            <h3 class="planType"></h3>

            <p class="planDescription"></p>

            <p class="planBenefits"></p>

            <p class="membership-price planPrice"></p>

            <p class="planDuration"></p>

            <button class="buy-btn">Buy now</button>

        </div>

    </template>

    <!-- BUY MODAL -->
    <div class="modal-overlay" id="modalOverlay"></div>

    <div class="modal" id="buyModal">

        <div class="modal-content">

            <div class="modal-left">

                <label>Start date:</label>
                <input type="date" id="startDate">

                <label>End date:</label>
                <input type="date" id="endDate" disabled>

            </div>

            <div class="modal-right">

                <h3 id="planType"></h3>

                <p id="planDescription"></p>

                <p id="planBenefits"></p>

                <p id="planDuration"></p>

                <p class="membership-price" id="planPrice"></p>

                <div class="ticket-selector">

                    <p>Select your number of tickets</p>

                    <div class="ticket-controls">

                        <button id="minusTicket">-</button>

                        <span id="ticketCount">1</span>

                        <button id="plusTicket">+</button>

                    </div>

                </div>

                <p class="total-price">
                    Total: <span id="totalPrice"></span>
                </p>

                <button id="confirmBuy" type="button">
                    Buy now
                </button>

            </div>

        </div>

    </div>

    <!-- CARD MODAL  -->
    <div class="modal-overlay" id="cardOverlay"></div>

    <div class="modal" id="cardModal">

        <div class="modal-content">

            <h2>Payment Information</h2>

            <label>Card Number</label>
            <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456">

            <label>Card Holder</label>
            <input type="text" id="cardHolder" placeholder="Name on card">

            <button id="confirmCard">Confirm Payment</button>

        </div>

    </div>

    <!-- ACCOUNT MODAL -->
    <div class="modal-overlay" id="accountModal">

        <div class="account-modal">

            <h2>Account</h2>

            <p><strong>Username:</strong></p>
            <p id="modalUsername"></p>

            <p><strong>Email:</strong></p>
            <p id="modalEmail"></p>

            <button id="logoutBtn">
                Log out
            </button>

        </div>

    </div>

    <br><br>

    <!-- SCRIPTS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="js/auth.js"></script>
    <script src="js/memberships.js"></script>

</body>

</html>
