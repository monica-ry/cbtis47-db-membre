<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Park Restaurants</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/logo.jpeg">
</head>

<body>

    <div id="navbar"></div>

    <!-- TITLE -->
    <h1 class="header">Restaurants</h1>

    <!-- CONTENT -->
    <div class="content-container" id="restaurantsContainer"></div>

    <!-- TEMPLATE -->
    <template id="restaurant-template">
        <div class="game-card">
            <img class="game-img">
            <h3 class="game-name"></h3>
            <p class="game-desc"></p>
        </div>
    </template>

    <!-- ACCOUNT MODAL -->
    <div class="modal-overlay" id="accountModal">
        <div class="account-modal">

            <div class="account-header">
                <div class="account-avatar"></div>
                <div class="account-info">
                    <h2>My Account</h2>
                    <span>Lu Loo Land Member</span>
                </div>
            </div>

            <div class="account-body">
                <div class="account-item">
                    <label>Username</label>
                    <p id="modalUsername"></p>
                </div>
                <div class="account-item">
                    <label>Email</label>
                    <p id="modalEmail"></p>
                </div>
                <button id="logoutBtn">Log out</button>
            </div>

        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/navbar.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/restaurants.js" defer></script>

</body>

</html>
