<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Park Events</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- TOP MENU -->
    <div class="top-menu">

        <div class="menu-logo">
            <img src="images/logo.jpeg" alt="logo">
        </div>

        <div class="menu-links">

            <div class="menu-item" onclick="checkAccess('memberships.html')">
                Membership
            </div>

            <div class="menu-item" onclick="location.href='games.html'">
                Games
            </div>

            <div class="menu-item" onclick="location.href='restaurants.html'">
                Restaurant
            </div>

            <div class="menu-item" onclick="location.href='parkInfo.html'">
                Park information
            </div>

        </div>

        <div class="menu-msg" onclick="checkAccess('messages.html')">
            <img src="images/msspark.png" alt="messages">
        </div>

        <div class="menu-profile" id="accountButton">
            <span id="userName">Log in</span>
        </div>

    </div>

    <!-- TITLE -->
    <h1 class="header">Recent Events</h1>

    <!-- CONTENT -->
    <div class="content-container" id="eventsContainer"></div>

    <!-- TEMPLATE -->
    <template id="event-template">
        <div class="game-card">
            <img class="game-img">
            <h3 class="game-name"></h3>
            <p class="game-desc"></p>
            <p class="game-date"></p>
        </div>
    </template>

    <!-- ACCOUNT MODAL -->
    <div class="modal-overlay" id="accountModal">

        <div class="account-modal">

            <h2>Account</h2>

            <p><strong>Username:</strong></p>
            <p id="modalUsername"></p>

            <p><strong>Email:</strong></p>
            <p id="modalEmail"></p>

            <button id="logoutBtn">
                Log out
            </button>

        </div>

    </div>

    <!-- SCRIPTS -->
    <script src="js/auth.js"></script>
    <script src="js/events.js?v=2" defer></script>

</body>

</html>
